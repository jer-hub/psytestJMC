services:
  db:
    image: postgres:15-alpine
    container_name: psytest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-psytest_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    ports:
      - "${DB_PUBLISH_PORT:-5432}:5432"
    volumes:
      - psytest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-psytest_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: development
    container_name: psytest-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: psytests.settings.dev
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-psytest_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123}
      SITE_ID: "2"
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost:8000}
      SITE_NAME: ${SITE_NAME:-psytestJMC}
      SEED_DATA: ${SEED_DATA:-1}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@localhost}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin123}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web,psytest-web}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - .:/app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

volumes:
  psytest_pgdata:
