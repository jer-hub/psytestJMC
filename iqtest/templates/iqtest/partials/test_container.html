{% load static %}
{% load iq_extras %}

<form action="{% url 'iqtest:test-container' %}" method="post" id="submit_form" class="iq-form">
  {% csrf_token %}
  {% for question in questions %}
  <section class="iq-question" aria-labelledby="q-{{ question.id }}-label">
    <div class="iq-question-prompt" id="q-{{ question.id }}-label">
      <span class="iq-question-number">{{ forloop.counter }}.</span>
      <div class="iq-question-content">{{ question.question.html|lazy_images }}</div>
    </div>

    <fieldset class="iq-choices">
      <legend class="visually-hidden">Choices for question {{ forloop.counter }}</legend>
      {% for choice in question.choices.all %}
      <label class="iq-choice" for="choice-{{ choice.id }}">
        <input
          class="form-check-input"
          type="radio"
          name="{{ question.id }}"
          id="choice-{{ choice.id }}"
          value="{{ choice.id }}:{{ choice.is_answer }}"
          required
        />
        <span class="iq-choice-body">{{ choice.choice.html|lazy_images }}</span>
      </label>
      {% endfor %}
    </fieldset>
  </section>
  {% endfor %}

  <div class="iq-submit">
    <input type="submit" class="btn btn-teal btn-lg" value="Submit" />
  </div>
</form>

<script src="{% static 'scripts/iq_timer.js' %}" defer></script>
