{% load static %}
<form id="submit_form" class="ct-form" action="{% url 'riasec:test_evaluate' %}" method="post">
  {% csrf_token %}
  {% for question in questions %}
  <fieldset class="ct-question" id="question_{{ forloop.counter }}">
    <legend class="ct-question-prompt">
      <span class="ct-question-number">{{ forloop.counter }}.</span>
      <span class="ct-question-text">{{ question.question }}</span>
    </legend>

    <div class="ct-likert" role="group" aria-label="Response for question {{ forloop.counter }}">
      <label class="ct-likert-option" for="strongly_disagree_{{ question.id }}">
        <input
          class="form-check-input"
          type="radio"
          name="{{ question.id }}"
          id="strongly_disagree_{{ question.id }}"
          value="0"
          required
        >
        <span class="ct-likert-score">1</span>
        <span class="ct-likert-label">Strongly Disagree</span>
      </label>

      <label class="ct-likert-option" for="disagree_{{ question.id }}">
        <input
          class="form-check-input"
          type="radio"
          name="{{ question.id }}"
          id="disagree_{{ question.id }}"
          value="0.25"
          required
        >
        <span class="ct-likert-score">2</span>
        <span class="ct-likert-label">Disagree</span>
      </label>

      <label class="ct-likert-option" for="neutral_{{ question.id }}">
        <input
          class="form-check-input"
          type="radio"
          name="{{ question.id }}"
          id="neutral_{{ question.id }}"
          value="0.5"
          required
        >
        <span class="ct-likert-score">3</span>
        <span class="ct-likert-label">Neutral</span>
      </label>

      <label class="ct-likert-option" for="agree_{{ question.id }}">
        <input
          class="form-check-input"
          type="radio"
          name="{{ question.id }}"
          id="agree_{{ question.id }}"
          value="0.75"
          required
        >
        <span class="ct-likert-score">4</span>
        <span class="ct-likert-label">Agree</span>
      </label>

      <label class="ct-likert-option" for="strongly_agree_{{ question.id }}">
        <input
          class="form-check-input"
          type="radio"
          name="{{ question.id }}"
          id="strongly_agree_{{ question.id }}"
          value="1"
          required
        >
        <span class="ct-likert-score">5</span>
        <span class="ct-likert-label">Strongly Agree</span>
      </label>
    </div>
  </fieldset>
  {% endfor %}

  <div class="ct-submit">
    <input type="submit" class="btn riasec-btn btn-lg" value="Submit">
  </div>
</form>

<script src="{% static 'scripts/riasec_timer.js' %}" defer></script>
