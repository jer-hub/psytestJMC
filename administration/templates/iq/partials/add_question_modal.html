<div class="modal fade admin-modal" id="add_question" tabindex="-1" aria-labelledby="add_question_title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="add_question_title">Add a question</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div id="id_alert_add_question" class="admin-modal__alert"></div>
      <div class="modal-body admin-modal__form d-flex flex-column gap-2">
        <p class="admin-modal__message mb-0">Write your question:</p>
        <div id="question_field">
          {% include 'iq/partials/add_question_field.html' %}
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="admin-manage-btn admin-manage-btn--ghost" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
