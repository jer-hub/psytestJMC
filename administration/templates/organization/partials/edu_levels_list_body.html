{% for edu_level in edu_levels %}
<tr>
  <td data-label="Education level">{{ edu_level.name }}</td>
  <td data-label="Select" class="admin-org-table__check">
    <input type="checkbox" name="edu_level" class="form-check-input" value="{{ edu_level.id }}">
  </td>
</tr>
{% endfor %}

{% if success %}
<div id="add_edu_msg" class="admin-org-msg admin-org-msg--ok fade-me-in-out" hx-swap-oob="true">
  <p>Added</p>
</div>
{% endif %}

{% if failed %}
<div id="add_edu_msg" class="admin-org-msg admin-org-msg--error fade-me-in-out" hx-swap-oob="true">
  <p>Already existed</p>
</div>
{% endif %}
