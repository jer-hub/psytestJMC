{% for program in programs %}
<tr>
  <td data-label="Program">{{ program.name }}</td>
  <td data-label=""></td>
  <td data-label="Select" class="admin-org-table__check">
    <input type="checkbox" name="program" class="form-check-input" value="{{ program.id }}">
  </td>
</tr>
{% endfor %}

{% if dept_code %}
<input type="hidden" id="dept_code" value="{{ dept_code }}">
{% endif %}

{% if success %}
<div id="add_prog_msg" class="admin-org-msg admin-org-msg--ok fade-me-in-out" hx-swap-oob="true">
  <p>Added</p>
</div>
{% endif %}

{% if failed %}
<div id="add_prog_msg" class="admin-org-msg admin-org-msg--error fade-me-in-out" hx-swap-oob="true">
  <p>Already existed</p>
</div>
{% endif %}
