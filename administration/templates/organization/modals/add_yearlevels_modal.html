<div class="modal fade admin-modal" id="yearlevels_modal" aria-labelledby="yearlevels_modal-label" aria-hidden="true" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="yearlevels_modal-label">Year levels</h5>
      </div>
      <div class="modal-body">
        <div class="collapse" id="add_yearlevel_collapse">
          <form id="add_yearlevel_form" class="admin-modal__form admin-org-inline-form mb-3">
            <input type="text" name="yearlevel_name" placeholder="Year level" class="form-control" required>
            <button type="submit" class="admin-manage-btn admin-manage-btn--primary">Add</button>
          </form>
          <div id="add_yearlevel_msg" class="admin-org-msg fade-me-in-out"></div>
        </div>
        <div class="admin-org-table-wrap">
          <table class="admin-org-table admin-org-table--compact">
            <thead>
              <tr>
                <th scope="col">Year level</th>
                <th scope="col">
                  <a class="admin-manage-btn admin-manage-btn--ghost admin-org-btn-sm" data-bs-toggle="collapse" href="#add_yearlevel_collapse" role="button" aria-expanded="false" aria-controls="add_yearlevel_collapse">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                      <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                      <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h12zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2z"/>
                    </svg>
                    Add
                  </a>
                </th>
                <th scope="col" class="admin-org-table__check">
                  <button type="button" class="admin-manage-btn admin-manage-btn--danger admin-org-btn-sm" data-bs-toggle="modal" data-bs-target="#yearlevel_delete_modal">
                    Delete
                  </button>
                </th>
              </tr>
            </thead>
            <tbody id="yearlevels_list">
              {% include 'organization/partials/yearlevel_list.html' %}
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="admin-manage-btn admin-manage-btn--ghost" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
