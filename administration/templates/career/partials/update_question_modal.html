<div class="modal fade admin-modal" id="update_question_{{ question.id }}" tabindex="-1" aria-labelledby="update_question_title_{{ question.id }}" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="update_question_title_{{ question.id }}">Update question</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form hx-post='{% url "administration:update-career-question" question.id %}' hx-target="#questions" hx-swap="innerHTML">
        {% csrf_token %}
        <div class="modal-body admin-modal__form" id="modal-body-{{ question.id }}"></div>
        <div class="modal-footer">
          <button type="button" class="admin-manage-btn admin-manage-btn--ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="admin-manage-btn admin-manage-btn--primary" data-bs-dismiss="modal">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
