<div class="modal fade admin-modal" id="delete_question" tabindex="-1" aria-labelledby="delete_question_title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="delete_question_title">Delete questions</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="admin-modal__message">Delete the selected questions? This cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="admin-manage-btn admin-manage-btn--ghost" data-bs-dismiss="modal">Cancel</button>
        <button
          type="button"
          id="delete_question_btn"
          class="admin-manage-btn admin-manage-btn--danger"
          data-url="{% url 'administration:delete-career-question' %}"
        >Delete</button>
      </div>
    </div>
  </div>
</div>
