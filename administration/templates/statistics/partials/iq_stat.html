{% load static %}
<div class="admin-stats-results">
  <aside class="admin-stats-summary">
    <div class="admin-stats-summary-head">
      <h2>IQ Bands</h2>
      {% block iq_count %}
      <p class="admin-stats-count" id="iq_count"></p>
      {% endblock %}
    </div>
    <ul class="admin-stats-score-list">
      <li id="li_exceptional"><span class="bg-color-a score-pill">Exceptional</span> {{ iq_exceptional|default:0 }}</li>
      <li id="li_excellent"><span class="bg-color-b score-pill">Excellent</span> {{ iq_excellent|default:0 }}</li>
      <li id="li_verygood"><span class="bg-color-c score-pill">Very Good</span> {{ iq_verygood|default:0 }}</li>
      <li id="li_good"><span class="bg-color-d score-pill">Good</span> {{ iq_good|default:0 }}</li>
      <li id="li_poor"><span class="bg-color-e score-pill">Poor</span> {{ iq_poor|default:0 }}</li>
    </ul>
  </aside>
  <div class="admin-stats-chart">
    <canvas id="iqChart" aria-label="IQ statistics chart"></canvas>
  </div>
</div>
